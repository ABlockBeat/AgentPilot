# Build the AgentPilot Android APK, free, on GitHub Actions.
# Runs on push and by hand. No card, no paid service, public repo free tier.
# The APK is the deliverable, the owner installs it directly on his phone.
# No Google Play, Play charges a 25 dollar one time developer fee.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # The repo default token is read only, so the release step gets 403
    # without this. Release creation needs contents write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list asks sdkmanager for the
          # obsolete "tools" package, which no longer exists in the SDK
          # repositories and fails the run. Install only packages that
          # exist: platform-tools, build-tools 34 and platform 34,
          # which is what AGP 8.5.2 with compileSdk 34 needs.
          packages: platform-tools build-tools;34.0.0 platforms;android-34
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # No gradlew wrapper in this repo, so Gradle comes from here.
          # AGP 8.5.2 needs Gradle 8.7 or newer.
          gradle-version: "8.7"
      - name: Restore signing keystore
        # The one stable signing key, stored as a base64 secret. Every
        # build signs with this key, so updates install over the old
        # version. Without it Gradle signs with a fresh debug key on
        # every runner and Android refuses the update.
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
      - name: Download cloudflared binary
        # The tunnel binary is 38 MB, over GitHub's 25 MB web-upload
        # limit, so it is never committed to the repo. The build
        # fetches the official arm64 release here and places it where
        # Gradle picks it up as a native lib, so the APK ships it
        # inside and the phone never downloads anything.
        # Pinned to release 2026.11.1 and checked by sha256: curl
        # --fail means a 404 or a redirect failure fails the build
        # instead of saving an error page as the binary.
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl --fail -sL -o app/src/main/jniLibs/arm64-v8a/libcloudflared.so https://github.com/cloudflare/cloudflared/releases/download/2026.11.1/cloudflared-linux-arm64
          echo "b155cec3e48e489cfb8e5c602769fb8c771083018d8881d68b4d18a791567c5a  app/src/main/jniLibs/arm64-v8a/libcloudflared.so" | sha256sum -c -
          ls -l app/src/main/jniLibs/arm64-v8a/
          file app/src/main/jniLibs/arm64-v8a/libcloudflared.so
      - name: Download ngrok binary
        # ngrok is the second tunnel, for phones where Cloudflare
        # does not start. Same size problem as cloudflared, so it
        # is never committed either. The stable arm64 tarball from
        # ngrok's own download host; file must say ARM aarch64, or
        # the build fails instead of shipping a bad file. The
        # tarball holds one binary, ngrok, renamed to a native lib
        # name so the app runs it from its native library dir.
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/ngrok-bin
          curl --fail -sL -o /tmp/ngrok.tgz https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-arm64.tgz
          tar -xzf /tmp/ngrok.tgz -C /tmp/ngrok-bin
          cp /tmp/ngrok-bin/ngrok app/src/main/jniLibs/arm64-v8a/libngrok.so
          ls -l app/src/main/jniLibs/arm64-v8a/
          file app/src/main/jniLibs/arm64-v8a/libngrok.so | grep -qi "ARM aarch64"
      - name: Build debug APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon
      - name: Verify tunnel binary in APK
        # The build must fail unless the tunnel binary actually
        # landed inside the APK at the expected size. A bad download
        # must never ship silently.
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "37818397.*lib/arm64-v8a/libcloudflared.so"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/libngrok.so"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agentpilot-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Read app version
        # The release tag must match the version in build.gradle.
        # The app's updater compares the tag version with the
        # installed version, so a hardcoded tag (the old v0.6.14
        # here) would stop every future update from ever being
        # offered once the installed version passes it.
        id: appversion
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle)" >> "$GITHUB_OUTPUT"
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appversion.outputs.name }}-${{ github.run_number }}
          name: AgentPilot v${{ steps.appversion.outputs.name }} build ${{ github.run_number }}
          body: "AgentPilot Android app, debug APK. New in 0.6.15: Settings now shows the tunnel's own last message, so a failure says why it failed instead of only 'Try again'. Also in this version: the app never updates by itself any more, Continue to Chrome only opens once the tunnel link exists, Help holds only the five steps, and the ngrok tunnel reports after 60 seconds."
          files: app/build/outputs/apk/debug/app-debug.apk
