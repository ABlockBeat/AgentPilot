# Build the Browser MCP Android APK, free, on GitHub Actions.
# Runs on push and by hand. No card, no paid service, public repo free tier.
# The APK is the deliverable, the owner installs it directly on his phone.
# No Google Play, Play charges a 25 dollar one time developer fee.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # The repo default token is read only, so the release step gets 403
    # without this. Release creation needs contents write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list asks sdkmanager for the
          # obsolete "tools" package, which no longer exists in the SDK
          # repositories and fails the run. Install only packages that
          # exist: platform-tools, build-tools 34 and platform 34,
          # which is what AGP 8.5.2 with compileSdk 34 needs.
          packages: platform-tools build-tools;34.0.0 platforms;android-34
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # No gradlew wrapper in this repo, so Gradle comes from here.
          # AGP 8.5.2 needs Gradle 8.7 or newer.
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: browser-mcp-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.4-${{ github.run_number }}
          name: Browser MCP v0.4.4 build ${{ github.run_number }}
          body: "Browser MCP Android app, debug APK. New in 0.4.4: the in-app web browser option is removed, only the real app drive remains. Only what works stays."
          files: app/build/outputs/apk/debug/app-debug.apk
