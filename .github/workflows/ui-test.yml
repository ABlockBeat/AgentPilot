# AgentPilot UI test, free, on GitHub Actions.
# Boots a cloud Android emulator, installs the debug APK, and runs a
# Maestro flow that screenshots the real user journey and fails loudly
# if the tunnel link never appears. No card, no paid service, public
# repo free tier. No secrets.
# Owner order 18 Nov 2026 11:32 PKT, FINAL: the test STAYS.
# Test again and again, so I know myself whether it works or not.
# (The 11:31 drop order was withdrawn by the owner at 11:32.)
name: UI Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        # The emulator needs KVM on Linux runners. This is the step
        # from the android-emulator-runner README.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Same packages as the main build workflow: the default
          # package list asks for the obsolete "tools" package and
          # fails, so only packages that exist are listed here.
          packages: platform-tools build-tools;34.0.0 platforms;android-34
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # No gradlew wrapper in this repo, so Gradle comes from here.
          gradle-version: "8.7"
      - name: Download x86_64 cloudflared for the emulator
        # The APK ships the tunnel binary for arm64 phones only. The
        # cloud emulator is x86_64, so without this the tunnel could
        # never start there and the link test would always fail. This
        # step stages the matching official binary, pinned and checked
        # by sha256, only for the test build. The phone APK is
        # unchanged: it still ships arm64 only. No secrets here.
        run: |
          mkdir -p app/src/main/jniLibs/x86_64
          curl --fail -sL -o app/src/main/jniLibs/x86_64/libcloudflared.so https://github.com/cloudflare/cloudflared/releases/download/2026.11.1/cloudflared-linux-amd64
          echo "97bb3b02d23a5980fc9c15a1a270e692da1923f103f920d5b16d4931d5ab55e7  app/src/main/jniLibs/x86_64/libcloudflared.so" | sha256sum -c -
          file app/src/main/jniLibs/x86_64/libcloudflared.so
      - name: Build debug APK
        # No signing key needed: a fresh emulator has no old install
        # to conflict with, so the default debug key is enough.
        run: gradle assembleDebug --no-daemon
      - name: Verify x86_64 tunnel binary in APK
        # The build must fail unless the tunnel binary actually
        # landed inside the APK. A bad download must never pass
        # silently into the test.
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/x86_64/libcloudflared.so"
      - name: Install Maestro CLI
        # Needs Java 17, already set up above. The installer puts
        # Maestro in $HOME/.maestro/bin; GITHUB_PATH keeps it on PATH
        # for the emulator step below. This runs before the emulator
        # step because the emulator only lives inside that step.
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --help
      - name: Run UI test on emulator
        # Linux runners are supported and recommended by the
        # android-emulator-runner README, faster than macOS. The
        # google_apis_playstore image is what brings Chrome: the
        # profile only picks the device shape. Chrome is the target
        # app the flow picks, so the Play Store image is required.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            export PATH="$HOME/.maestro/bin:$PATH"
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure enabled_accessibility_services com.browsermcp/com.browsermcp.DriveService
            adb shell settings put secure accessibility_enabled 1
            echo "--- accessibility service state ---"
            adb shell settings get secure enabled_accessibility_services
            adb shell settings get secure accessibility_enabled
            for i in 1 2 3 4 5 6; do if adb shell dumpsys accessibility | grep -qi "browsermcp"; then echo "service bound after check $i"; break; fi; sleep 5; done
            adb shell dumpsys accessibility | grep -i "browsermcp" || echo "SERVICE NOT FOUND IN DUMPSYS"
            adb shell dumpsys accessibility
            maestro test --test-output-dir maestro-output maestro/agentpilot-flow.yaml || (adb shell dumpsys accessibility; exit 1)
      - name: Show failure hierarchy in log
        # The Maestro step prints only the failed assertion, never what
        # was actually on screen. Dump the debug files into the log
        # itself, so the next failure says what the emulator showed.
        # NOTE: the output dir name has a space in it ("AgentPilot UI
        # test"), so the find loop must be NUL-delimited, or head gets
        # a truncated path and the step fails. The hierarchy file is a
        # .json, not .xml, and the crash report is a .txt.
        if: always()
        run: |
          ls -R maestro-output || true
          find maestro-output -type f \( -name "*.json" -o -name "*.txt" -o -name "*.log" \) -print0 2>/dev/null | while IFS= read -r -d '' f; do echo "== $f"; head -c 6000 "$f"; echo; done
          echo "--- all text on screen at each failure ---"
          python3 -c "
          import json, glob
          for f in sorted(glob.glob('maestro-output/**/screen-hierarchy/*.json', recursive=True)):
              print('==', f)
              try:
                  d = json.load(open(f))
                  texts = set()
                  def walk(n):
                      if isinstance(n, dict):
                          if n.get('text'): texts.add(str(n['text']))
                          for v in n.values(): walk(v)
                      elif isinstance(n, list):
                          for v in n: walk(v)
                  walk(d)
                  print('TEXTS ON SCREEN:', sorted(texts))
              except Exception as e:
                  print('parse failed:', e)
          "
          echo "--- crash reports in full ---"
          find maestro-output -name "crash-report.txt" -print0 2>/dev/null | while IFS= read -r -d '' f; do echo "== $f"; cat "$f"; echo; done
      - name: Upload Maestro output
        # Always runs, even when the flow fails, so the screenshots
        # are there to look at either way.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output
          path: maestro-output
