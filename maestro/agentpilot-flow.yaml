# AgentPilot UI test, run by Maestro on a cloud emulator.
#
# What it tests, in order:
#   Part 1, fresh install: the home screen shows AgentPilot with
#   "Not set up", and "Set up" opens the "Pick an app" picker.
#   Part 2, full journey: pick Chrome, reach Running, the tunnel
#   starts by itself with the session, and within 60 seconds it
#   must reach a definite outcome: either the trycloudflare.com
#   link appears, or a clear tunnel error appears. If neither
#   outcome shows, the flow FAILS. That is the bug this test hunts:
#   the tunnel starts but nothing ever shows, the app hangs on
#   "Connecting…" forever. Then Help opens and the connection key
#   must be visible.
#
# What it needs before it runs (the CI workflow does this):
#   - The APK installed on the emulator.
#   - The Accessibility service enabled with adb, so the home
#     screen goes Ready instead of asking to turn it on.
#   - The emulator image must have Chrome (the Play Store image
#     does). If Chrome is not in the shortlist, the flow opens
#     "Show all apps" and picks it there.
#
# What it does NOT test: the owner's real Chrome logins, his
# phone network, or OEM battery killers. The emulator is a
# clean room, not his phone.
appId: com.browsermcp
name: AgentPilot UI test
---
# Part 1: fresh install. The fresh state comes from the workflow, which
# uninstalls the app before installing it. Do NOT use clearState, and
# do NOT let launchApp stop the app first (stopApp defaults true):
# stopping it force-stops the app and kills the Accessibility service
# binding the workflow enabled before Maestro started, so the home
# screen then says "Accessibility off" and "Start" never appears.
# UI Test #28 proved it in logcat: "Force stopping com.browsermcp",
# pid 3213 killed, relaunched as pid 4890, service never rebound.
- launchApp:
    stopApp: false
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Not set up"
    timeout: 20000
- assertVisible: "AgentPilot"
- assertVisible: "Not set up"
- takeScreenshot: home-fresh-install
- tapOn: "Set up"
- assertVisible: "Pick an app"
- takeScreenshot: picker
- back
- assertVisible: "Not set up"

# Part 2: pick Chrome and drive the app to Running.
- tapOn: "Set up"
- assertVisible: "Pick an app"
- runFlow:
    when:
      visible: "Chrome"
    commands:
      - tapOn: "Chrome"
# The second branch runs only while the picker is still open.
# After Chrome is tapped the picker closes at once, so checking
# for Chrome would always be true then and the branch would run
# by mistake. Checking for the picker itself is the right guard.
- runFlow:
    when:
      visible: "Pick an app"
    commands:
      - tapOn: "Show all apps"
      - tapOn: "Chrome"
# The main button says Start once Accessibility is on. The text
# is matched exactly, so no other button below it is ever tapped
# by mistake. The wait covers the service binding after launch.
# UI Test #79: the service binds before Maestro, drops during the
# flow (instance null, no onUnbind logged, same pid 3311, so no
# force-stop), and rebinds about 18s after the Chrome tap
# (a11yOn=true at 10:33:53). A 15s wait was just short of it.
# 60s covers the rebind and still fails fast if it never comes.
- extendedWaitUntil:
    visible:
      text: "^Start$"
    timeout: 60000
- tapOn:
    text: "^Start$"
# UI Test #198: the wait above still failed even though logcat
# showed "updateUi target=Chrome a11yOn=true running=true".
# Root cause: updateUi() overwrites the status line with a
# transient message for up to 8s (MainActivity.kt, transientStatus),
# and each new status() call restarts that window, so "Chrome ·
# Running" can stay covered for the whole 15s poll. The action
# button is never overwritten by the transient logic: it reads
# "Disconnect" exactly while running, "Start" otherwise. Wait for
# the stable button, not the transient-covered status line.
- extendedWaitUntil:
    visible:
      text: "^Disconnect$"
    timeout: 15000
- takeScreenshot: home-running

# Part 3: the tunnel must reach a definite outcome within 60 seconds.
# Either the trycloudflare.com link appears, or a clear tunnel error
# appears on screen ("Tunnel did not start. Try again.", "Tunnel
# stopped. Try again.", "No internet. Try again.", "Could not start.
# Try again."). The emulator cannot reach Cloudflare, so demanding
# the link alone made this part unpassable by design. What this part
# still hunts is the real bug: the tunnel starts but NO outcome ever
# shows, the app hangs on "Connecting…" forever. If neither outcome
# appears in 60 seconds, the wait below fails the flow. Once an
# outcome is there, only its branch runs: the link branch asserts
# the link and Share connection, the error branch screenshots the
# error state for the log.
- extendedWaitUntil:
    visible:
      text: ".*(trycloudflare.com|Tunnel did not start|Tunnel stopped|No internet|Could not start).*"
    timeout: 60000
- runFlow:
    when:
      visible: "trycloudflare.com"
    commands:
      - assertVisible: "trycloudflare.com"
      - assertVisible: "Share connection"
      - takeScreenshot: tunnel-link-visible
- runFlow:
    when:
      visible: "Try again."
    commands:
      - takeScreenshot: tunnel-error-visible
- runFlow:
    when:
      visible: "Reinstall the app"
    commands:
      - takeScreenshot: tunnel-error-visible

# Part 4: the connection key lives in Help.
- tapOn: "Help"
- assertVisible: "Connection key (tap to copy):"
- takeScreenshot: help-connection-key
- back
