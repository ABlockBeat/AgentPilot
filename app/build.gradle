android {
    namespace = "com.browsermcp"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.browsermcp"
        minSdk = 26
        targetSdk = 34
        versionCode = 31
        versionName = "0.6.16"
    }

    signingConfigs {
        release {
            // Stable signing key: the same key signs every build, so an
            // update installs over the old version. Without this Gradle
            // signs with a fresh debug key on every Actions runner, and
            // Android refuses the update (wrong signature). The keystore
            // lives in GitHub Actions secrets, never in the repo. When
            // the env vars are absent (a local build) the debug build
            // just uses the default debug key as before.
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        // The manifest sets android:extractNativeLibs="true", so the
        // tunnel binaries stay as files the app can run. AGP wants
        // that choice stated here too, or the package step fails with
        // "useLegacyPackaging should be set to true".
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // AndroidX core, only for FileProvider, which serves the downloaded
